name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.9

      - name: 打印运行上下文
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "event_name = $EVENT_NAME"
          echo "ref        = $REF_NAME"
          echo "github.sha = $SHA"
          echo "head.sha   = $PR_HEAD_SHA"

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: 打包并计算校验和
        if: github.event_name == 'push'
        env:
          VERSION: 0.0.0-main
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package VERSION="$VERSION" BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          sha256sum dist/*.tar.gz
          sha256sum dist/*/enroll-conflict

      - name: 上传制品
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: enroll-conflict-${{ github.sha }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14
