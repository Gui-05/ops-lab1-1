name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release gate
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit=$(git rev-parse --verify "${TAG_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Release rejected: tag commit $tag_commit is not in origin/main history."
            exit 1
          fi
          echo "Release gate passed: $tag_commit is in origin/main history."

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: Package and checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          make package VERSION="$VERSION" BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          sha256sum dist/*/enroll-conflict
          sha256sum dist/*.tar.gz

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" \
            --notes "Release $TAG_NAME. Build metadata is included in BUILD_INFO." \
            dist/*.tar.gz dist/*.tar.gz.sha256

  image:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
      ACTOR: ${{ github.actor }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare image metadata
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG=enroll-conflict_${version}_linux_amd64" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GH_REPO,,}" >> "$GITHUB_ENV"

      - name: Download and verify Release assets
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" \
            --pattern "$PKG.tar.gz" \
            --pattern "$PKG.tar.gz.sha256" \
            --dir release-assets
          cd release-assets
          sha256sum -c "$PKG.tar.gz.sha256"
          tar -xzf "$PKG.tar.gz"
          cat "$PKG/BUILD_INFO"

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build image from Release binary
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^commit=//p' "release-assets/$PKG/BUILD_INFO")
          test -n "$commit"
          docker build --platform linux/amd64 \
            --file Dockerfile \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$commit" \
            --build-arg SOURCE="$SOURCE" \
            --tag "$IMAGE:$TAG_NAME" \
            "release-assets/$PKG"

      - name: Push image and record digest
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG_NAME"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$TAG_NAME" |
            tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"