name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 tag 属于 main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "拒绝发布：tag 指向的提交 $TAG_SHA 不在 origin/main 的历史中。" >&2
            exit 1
          fi

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.9

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: 打包并计算校验和
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          make package VERSION="$VERSION" BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          sha256sum dist/*.tar.gz
          sha256sum dist/*/enroll-conflict

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --title "$RELEASE_TAG" \
            --generate-notes
